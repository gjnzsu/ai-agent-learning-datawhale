 <text x="575" y="510" text-anchor="middle" class="station">平台分层</text><text x="575" y="586" text-anchor="middle" class="minor">核心组件与职责</text>
 <text x="895" y="510" text-anchor="middle" class="station">可靠性与可观测性</text><text x="895" y="586" text-anchor="middle" class="minor">发布 · 回滚 · Trace</text>
 <text x="1290" y="510" text-anchor="middle" class="station">框架选型与集成</text><text x="1290" y="586" text-anchor="middle" class="minor">Java / Python</text>
</g>
<g id="week4"><path class="track" stroke="#18a6a0" d="M438 651H1510"/><rect x="122" y="611" width="80" height="80" rx="22" fill="#18a6a0"/><text x="145" y="663" class="number">04</text><text x="230" y="648" class="name">知识线</text><text x="230" y="677" class="minor">RAG · 记忆 · 协议</text>
