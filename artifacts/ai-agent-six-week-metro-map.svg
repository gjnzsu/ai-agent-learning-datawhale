 <text x="575" y="726" text-anchor="middle" class="station">Agent 评估框架</text><text x="575" y="802" text-anchor="middle" class="minor">六维指标与门槛</text>
 <text x="895" y="726" text-anchor="middle" class="station">安全与红队</text><text x="895" y="802" text-anchor="middle" class="minor">越权 · 注入 · 泄漏</text>
 <text x="1290" y="726" text-anchor="middle" class="station">上线准入与运营</text><text x="1290" y="802" text-anchor="middle" class="minor">监控 · 事件闭环</text>
</g>
<g id="week6"><path class="track" stroke="#45a66d" d="M438 867H1510"/><rect x="122" y="827" width="80" height="80" rx="22" fill="#45a66d"/><text x="145" y="879" class="number">06</text><text x="230" y="864" class="name">PoC 设计线</text><text x="230" y="893" class="minor">KYC / 信贷材料初审</text>
 <g stroke="#45a66d"><circle class="stop" cx="575" cy="867" r="14"/><circle class="stop" cx="895" cy="867" r="14"/><circle class="stop" cx="1290" cy="867" r="14"/></g>
 <text x="575" y="834" text-anchor="middle" class="station">范围 · Case · 架构</text><text x="575" y="910" text-anchor="middle" class="minor">合成数据与边界</text>
 <text x="895" y="834" text-anchor="middle" class="station">RAG · 工具 · FastAPI</text><text x="895" y="910" text-anchor="middle" class="minor">实现方案</text>
 <text x="1290" y="834" text-anchor="middle" class="station">评估 · 安全 · 交付</text><text x="1290" y="910" text-anchor="middle" class="minor">设计完成，待执行</text>
</g>
<path d="M1510 867Q1605 867 1605 960H430" fill="none" stroke="#97b7a5" stroke-width="9" stroke-dasharray="14 12" stroke-linecap="round"/>
<rect x="124" y="983" width="1540" height="156" rx="24" fill="#eaf4ee"/>
<text x="163" y="1025" class="eyebrow" style="fill:#377c55">下一站 · POC 实践</text>
