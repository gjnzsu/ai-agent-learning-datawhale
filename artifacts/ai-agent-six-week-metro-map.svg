<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1300" viewBox="0 0 1800 1300" role="img" aria-labelledby="title desc">
<title id="title">AI Agent 六周学习地铁图</title>
<desc id="desc">六条线路对应六周课程。十七站理论课程已完成，右下角 M0 到 M5 的 PoC 实践为下一阶段。</desc>
<defs>
  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce5ed"/></pattern>
  <filter id="shade" x="-10%" y="-30%" width="120%" height="170%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#16324d" flood-opacity=".08"/></filter>
  <style>
  text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;fill:#193148}
  .eyebrow{font-size:20px;letter-spacing:4px;font-weight:700;fill:#507083}
  .title{font-size:58px;font-weight:800;letter-spacing:1px}
  .sub{font-size:23px;fill:#597183}
  .week{font-size:24px;font-weight:800;fill:white}
  .name{font-size:27px;font-weight:750}
  .station{font-size:22px;font-weight:650}
  .minor{font-size:17px;fill:#6c8292}
  .tag{font-size:17px;font-weight:700;fill:#466477}
  .number{font-size:19px;font-weight:800;fill:white}
  .track{fill:none;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
  .stop{fill:white;stroke-width:7}
  </style>
</defs>
<rect width="1800" height="1300" fill="#f5f9fb"/>
<rect width="1800" height="1300" fill="url(#dots)" opacity=".55"/>
<rect x="70" y="53" width="1660" height="1150" rx="32" fill="#fff" filter="url(#shade)"/>
<text x="124" y="112" class="eyebrow">DATAWHALE · HELLO-AGENTS</text>
<text x="120" y="188" class="title">AI Agent 六周学习地图</text>
<text x="123" y="232" class="sub">从场景判断到受控 PoC · 地铁线网版</text>
<g transform="translate(1300 112)"><circle r="11" fill="white" stroke="#4b7384" stroke-width="5"/><text x="25" y="7" class="tag">已完成理论课</text></g>
<g transform="translate(1300 151)"><path d="M-12 0H12" stroke="#7898a7" stroke-width="6" stroke-dasharray="7 5"/><text x="25" y="7" class="tag">下一阶段实践</text></g>

<!-- The interchange corridor is intentionally secondary to the six weekly routes. -->
<path d="M1135 327V867" stroke="#c2d2d9" stroke-width="7" stroke-dasharray="10 12"/>
<text x="1160" y="615" class="minor">能力换乘：治理 · 证据 · 评估</text>

<g id="week1"><path class="track" stroke="#3778db" d="M438 327H1510"/><rect x="122" y="287" width="80" height="80" rx="22" fill="#3778db"/><text x="145" y="339" class="number">01</text><text x="230" y="324" class="name">起步线</text><text x="230" y="353" class="minor">Agent 基础与场景</text>
 <g stroke="#3778db"><circle class="stop" cx="575" cy="327" r="14"/><circle class="stop" cx="1135" cy="327" r="14"/></g>
 <text x="575" y="286" text-anchor="middle" class="station">初识智能体</text><text x="575" y="371" text-anchor="middle" class="minor">LLM / Workflow / Agent</text>
 <text x="1135" y="286" text-anchor="middle" class="station">银行 AI 场景筛选</text><text x="1135" y="371" text-anchor="middle" class="minor">适用性 · 风险边界</text>
</g>
<g id="week2"><path class="track" stroke="#ed765b" d="M438 435H1510"/><rect x="122" y="395" width="80" height="80" rx="22" fill="#ed765b"/><text x="145" y="447" class="number">02</text><text x="230" y="432" class="name">执行线</text><text x="230" y="461" class="minor">推理 · 工具 · 人审</text>
 <g stroke="#ed765b"><circle class="stop" cx="575" cy="435" r="14"/><circle class="stop" cx="895" cy="435" r="14"/><circle class="stop" cx="1290" cy="435" r="14"/></g>
 <text x="575" y="402" text-anchor="middle" class="station">ReAct 与受控工具</text><text x="575" y="478" text-anchor="middle" class="minor">观察—行动循环</text>
 <text x="895" y="402" text-anchor="middle" class="station">Plan-and-Solve / Reflection</text><text x="895" y="478" text-anchor="middle" class="minor">规划与反思</text>
 <text x="1290" y="402" text-anchor="middle" class="station">Human-in-the-loop</text><text x="1290" y="478" text-anchor="middle" class="minor">审批与执行治理</text>
</g>
<g id="week3"><path class="track" stroke="#8a6bd3" d="M438 543H1510"/><rect x="122" y="503" width="80" height="80" rx="22" fill="#8a6bd3"/><text x="145" y="555" class="number">03</text><text x="230" y="540" class="name">平台线</text><text x="230" y="569" class="minor">架构 · 可靠性 · 集成</text>
