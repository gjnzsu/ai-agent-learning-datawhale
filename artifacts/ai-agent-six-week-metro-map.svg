 <text x="575" y="618" text-anchor="middle" class="station">制度 RAG</text><text x="575" y="694" text-anchor="middle" class="minor">知识治理与引用</text>
 <text x="895" y="618" text-anchor="middle" class="station">记忆与上下文隔离</text><text x="895" y="694" text-anchor="middle" class="minor">跨会话边界</text>
 <text x="1290" y="618" text-anchor="middle" class="station">MCP / A2A / ANP</text><text x="1290" y="694" text-anchor="middle" class="minor">身份传递</text>
</g>
<g id="week5"><path class="track" stroke="#e5a528" d="M438 759H1510"/><rect x="122" y="719" width="80" height="80" rx="22" fill="#e5a528"/><text x="145" y="771" class="number">05</text><text x="230" y="756" class="name">护航线</text><text x="230" y="785" class="minor">评估 · 安全 · 运营</text>
